[project]
name = "human-factors-assistant"
version = "0.3.0"
description = "Evidence-driven personal assistant for human factors engineers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0.1",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

